name: Build docs

on:
  push:
    branches: [main]
    paths:
      - "docs/synth-behavior.md"
      - "docs/roadmap.md"
      - "docs/assets/article.css"
      - "docs/build/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (mermaid-cli, md-to-pdf)
        run: npm install

      - name: Render docs (mermaid diagrams -> SVG, markdown -> HTML/PDF)
        run: node docs/build/render-docs.mjs

      - name: Commit rendered docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/synth-behavior.pdf docs/synth-behavior.html docs/roadmap.html
          if git diff --cached --quiet; then
            echo "No changes to rendered docs"
          else
            git commit -m "docs: rebuild rendered docs [skip ci]"
            git push
          fi
