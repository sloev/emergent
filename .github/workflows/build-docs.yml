name: Build docs

on:
  push:
    branches: [main]
    paths:
      - "docs/synth-behavior.md"
      - "docs/roadmap.md"
      - "docs/assets/article.css"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render synth-behavior.pdf
        run: |
          npx --yes md-to-pdf docs/synth-behavior.md \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Render synth-behavior.html
        run: |
          npx --yes md-to-pdf docs/synth-behavior.md --as-html \
            --stylesheet docs/assets/article.css \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Render roadmap.html
        run: |
          npx --yes md-to-pdf docs/roadmap.md --as-html \
            --stylesheet docs/assets/article.css \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Commit rendered docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/synth-behavior.pdf docs/synth-behavior.html docs/roadmap.html
          if git diff --cached --quiet; then
            echo "No changes to rendered docs"
          else
            git commit -m "docs: rebuild rendered docs [skip ci]"
            git push
          fi
