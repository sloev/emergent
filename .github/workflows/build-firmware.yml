name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - "src/esp32/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "src/esp32/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, esp32-s3-devkitc-1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (${{ matrix.env }})
        working-directory: src/esp32
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem image (${{ matrix.env }})
        working-directory: src/esp32
        run: pio run -e ${{ matrix.env }} -t buildfs
