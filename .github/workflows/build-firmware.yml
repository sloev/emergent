name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - "src/esp32/**"
      - "src/station/**"
      - "src/sim/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "src/esp32/**"
      - "src/station/**"
      - "src/sim/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Host-native tests for the pure logic factored out of the core/body
      # layer (channel encode/decode, decay/aging, rate-limit math, LEDC
      # allocation bounds) — see src/esp32/test/. Explicitly -e native so
      # this never tries to run against real hardware.
      - name: Run native unit tests
        working-directory: src/esp32
        run: pio test -e native

  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the simulator against the firmware's header-only behavior
      # engine and runs a short smoke comparison, so an engine change that
      # breaks the simulator (or makes it crash) fails here.
      - name: Build simulator
        working-directory: src/sim
        run: make

      - name: Smoke run
        working-directory: src/sim
        run: |
          ./emergent-sim --runs 2 --lives 2 --hours 0.5
          for k in 3 7 12 20; do ./emergent-sim --organism $k --condition full --runs 1 --lives 1 --hours 0.3; done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, esp32-s3-devkitc-1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (${{ matrix.env }})
        working-directory: src/esp32
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem image (${{ matrix.env }})
        working-directory: src/esp32
        run: pio run -e ${{ matrix.env }} -t buildfs

  build-station:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build charging station firmware
        working-directory: src/station
        run: pio run -e esp32dev
