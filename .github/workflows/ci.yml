name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  organism-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make -C src/sim test
      - name: Simulator smoke run
        working-directory: src/sim
        run: |
          make
          ./emergent-sim --runs 2 --lives 2 --hours 0.5
          for k in 3 7 12 20; do ./emergent-sim --organism $k --condition full --runs 1 --lives 1 --hours 0.3; done

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install --upgrade platformio
      - name: Robot (both boards)
        run: pio run -d src/esp32 -e esp32dev -e esp32-s3-devkitc-1
      - name: Station
        run: pio run -d src/station
