name: Build synth-behavior PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/synth-behavior.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render PDF from markdown
        run: |
          npx --yes md-to-pdf docs/synth-behavior.md \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/synth-behavior.pdf
          if git diff --cached --quiet; then
            echo "No changes to synth-behavior.pdf"
          else
            git commit -m "docs: rebuild synth-behavior.pdf [skip ci]"
            git push
          fi
