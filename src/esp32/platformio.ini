; Emergent firmware — PlatformIO project
;
; Board support is selected per environment below. Each environment sets
; ACTIVE_BOARD_HEADER to its profile header path; src/board_config.cpp just
; includes it. Add a new board by adding an environment here and a matching
; profile header in boards/ — no other file changes needed.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    esp32async/ESPAsyncWebServer@^3.12.1
    esp32async/AsyncTCP@^3.5.0
    bblanchon/ArduinoJson@^7.2.1

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DACTIVE_BOARD_HEADER='"boards/board_esp32dev.h"'

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DACTIVE_BOARD_HEADER='"boards/board_esp32s3.h"'

; Host-native unit tests for the pure, hardware-independent logic pulled out
; of the core/body layer specifically so it's testable without a board (see
; include/{core,body}/*.h headers referenced by test/*). Run with
; `pio test -e native` — deliberately excluded from default_envs so a bare
; `pio run`/`pio test` never tries to build or test it by accident.
[env:native]
platform = native
build_flags =
    -std=gnu++17
framework =
lib_deps =
board_build.filesystem =
test_framework = unity
