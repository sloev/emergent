; Emergent firmware. One environment per board; each selects its channel
; profile header via ACTIVE_BOARD_HEADER (include/boards/).

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DACTIVE_BOARD_HEADER='"boards/board_esp32dev.h"'

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DACTIVE_BOARD_HEADER='"boards/board_esp32s3.h"'
