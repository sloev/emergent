; Charging station reference firmware — see README.md and
; docs/synth-behavior.md §11. Deliberately a separate, much simpler
; PlatformIO project from src/esp32: the station is a state machine, not an
; organism, so it doesn't need the robot's board-profile/body abstraction.
; Pin numbers live as named constants at the top of src/main.cpp instead —
; there's exactly one station design here, not many interchangeable bodies.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
